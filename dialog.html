<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Request on Seerr</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    header {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 14px 16px;
      background: var(--gray-900);
      border-bottom: 1px solid var(--gray-700);
    }

    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-300);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    header .query { color: var(--indigo-400); }

    #list { padding: 10px 12px 16px; }

    .item {
      display: flex;
      gap: 12px;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: background 150ms ease-in-out, border-color 150ms ease-in-out;
    }

    .item:hover { background: var(--gray-800); }

    .item.selected {
      background: var(--gray-800);
      border-color: var(--indigo-500);
      cursor: default;
    }

    .poster {
      flex: 0 0 56px;
      width: 56px;
      height: 84px;
      border-radius: 6px;
      background: var(--gray-700);
      object-fit: cover;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    .meta { min-width: 0; flex: 1; }

    .title {
      font-weight: 700;
      color: var(--gray-100);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sub {
      color: var(--gray-400);
      font-size: 12.5px;
      margin-top: 2px;
    }

    .overview {
      color: var(--gray-400);
      font-size: 12.5px;
      margin-top: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Seerr-style rounded-full badges */
    .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      vertical-align: 1px;
    }

    .badge.tv { background: rgba(99, 102, 241, 0.2); border: 1px solid var(--indigo-500); color: var(--indigo-400); }
    .badge.movie { background: rgba(59, 130, 246, 0.2); border: 1px solid #3b82f6; color: #93c5fd; }
    .badge.have { background: rgba(52, 211, 153, 0.15); border: 1px solid var(--green-400); color: var(--green-400); }

    .confirm {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn.sm { padding: 6px 10px; font-size: 12px; }

    .confirm .note { color: var(--gray-400); font-size: 12px; }

    .state {
      padding: 28px 16px;
      text-align: center;
      color: var(--gray-400);
    }

    .state.err { color: var(--red-400); }
    .state .btn { margin-top: 14px; }

    .result-msg { font-size: 12.5px; }
    .result-msg.ok { color: var(--green-400); }
    .result-msg.err { color: var(--red-400); }
  </style>
</head>
<body>
  <header><h1>Request <span class="query" id="queryText"></span></h1></header>
  <div id="content"></div>
  <script src="dialog.js"></script>
</body>
</html>
