<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seerr Search — Settings</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(460px, calc(100vw - 48px));
      padding: 24px;
      background: var(--gray-800);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .logo {
      display: block;
      margin: 4px auto 16px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 20px;
      font-weight: 700;
      color: var(--gray-300);
      text-align: center;
    }

    .field { margin-top: 16px; }
    .field:first-of-type { margin-top: 0; }

    .field-hint {
      margin: 4px 0 0;
      color: var(--gray-500);
      font-size: 12px;
    }

    fieldset {
      margin: 20px 0 0;
      padding: 0;
      border: none;
    }

    fieldset legend {
      padding: 0;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--gray-400);
    }

    .radio-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }

    .radio-row input {
      accent-color: var(--indigo-600);
      width: 16px;
      height: 16px;
    }

    .radio-row label {
      margin: 0;
      font-weight: 400;
      font-size: 14px;
      color: var(--gray-300);
      cursor: pointer;
    }

    #save { margin-top: 20px; }

    #status {
      margin-top: 12px;
      font-size: 13px;
      min-height: 1.5em;
      color: var(--gray-400);
    }

    #status.ok { color: var(--green-400); }
    #status.err { color: var(--red-400); }

    footer {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--gray-700);
      text-align: center;
      font-size: 12.5px;
      color: var(--gray-400);
    }

    footer a {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--indigo-500);
      text-decoration: none;
      transition: color 150ms ease-in-out;
    }

    footer a:hover { color: var(--indigo-400); }
    footer a svg { fill: currentColor; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="icons/icon128.png" alt="" width="72" height="72" />
    <h1>Seerr Search</h1>

    <div class="field">
      <label for="baseUrl">Seerr address</label>
      <input type="url" id="baseUrl" placeholder="https://seerr.home.example" spellcheck="false" autocomplete="off" />
    </div>

    <div class="field">
      <label for="apiKey">API key</label>
      <input type="password" id="apiKey" placeholder="Paste from Seerr → Settings → General" spellcheck="false" autocomplete="off" />
      <p class="field-hint">Needed for requesting. Searching works without it.</p>
    </div>

    <fieldset>
      <legend>Request trigger</legend>
      <div class="radio-row">
        <input type="radio" name="trigger" id="t-menu" value="menu" />
        <label for="t-menu">Right-click menu only</label>
      </div>
      <div class="radio-row">
        <input type="radio" name="trigger" id="t-button" value="button" />
        <label for="t-button">Floating button only</label>
      </div>
      <div class="radio-row">
        <input type="radio" name="trigger" id="t-both" value="both" checked />
        <label for="t-both">Both</label>
      </div>
    </fieldset>

    <button id="save" class="btn">Save settings</button>
    <div id="status" role="status"></div>

    <footer>
      by Chris Ivarson &middot;
      <a href="https://github.com/civarson/seerr-search" target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>GitHub</a>
    </footer>
  </main>

  <script src="options.js"></script>
</body>
</html>
